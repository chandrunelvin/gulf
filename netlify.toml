[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200

# SPA fallback: let react-router handle all other unmatched routes client-side.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
